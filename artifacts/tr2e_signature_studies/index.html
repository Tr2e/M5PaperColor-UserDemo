<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tr2e · 六种落款</title><style>
:root{color-scheme:light;--paper:#f3f0e9;--ink:#2e332f;--muted:#70756e;--line:#d4d7cd;--green:#3d5b4b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,select{font:inherit}button{cursor:pointer}a{color:var(--green)}header,main,footer{max-width:1392px;margin:auto;padding:0 24px}header{padding-top:46px;padding-bottom:26px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:2px}h1{font-size:36px;font-weight:500;margin:12px 0}header p{max-width:840px;color:var(--muted);margin:8px 0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px}.toolbar button,dialog button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:7px 14px;border-radius:3px}.toolbar button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:#f9f7f2;border:1px solid var(--line);padding:18px;min-width:0}.card h2{font-size:20px;font-weight:500;margin:0}.code{font:22px Georgia,serif;display:inline-block;width:30px}.desc{color:var(--muted);font-size:13px;min-height:44px;margin:9px 0}.micro{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-bottom:12px;gap:8px}.micro img{width:130px;height:80px;image-rendering:pixelated;background:white}.micro span{font-size:12px;color:var(--muted)}.sheet{position:relative;display:block;width:100%;max-width:400px;aspect-ratio:2/3;margin:auto;background:white;box-shadow:0 2px 8px #0001;padding:0;border:0;line-height:0;cursor:zoom-in}.base{display:block;width:100%;height:100%}.patch{position:absolute;left:75%;top:88.3333333333%;width:16.25%;height:6.6666666667%;image-rendering:auto}.note{font-size:13px;margin:13px 0 0;min-height:44px}.recommended{border-top:3px solid var(--green);padding-top:16px}.tag{font-size:11px;color:var(--green);float:right;line-height:34px}.downloads{font-size:12px}.downloads a{margin-right:12px}footer{padding-top:28px;padding-bottom:44px;color:var(--muted);font-size:12px}dialog{border:0;border-radius:5px;padding:18px;background:var(--paper);width:450px;max-width:calc(100% - 24px);max-height:95vh;color:var(--ink)}dialog::backdrop{background:#1f2923bb}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}button:focus-visible,a:focus-visible{outline:3px solid #b58b53;outline-offset:3px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){header,main,footer{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}.desc,.note{min-height:0}h1{font-size:30px}.toolbar button{padding:6px 9px}}
</style></head><body><header><div class="eyebrow">Tr2e / SIGNATURE STUDIES</div><h1>给这页日历，一个轻一点的落款。</h1><p>沿用衬线字、细边框和黑白留白，做六种不同的署名方式。每版都放在同一张日签上；作者行、正文间距与日历内容保持一致。</p><p>我更倾向 <b>C · 开放角标</b>，其次是 <b>A · 书末署名</b>。如果仍想保留明显的印章感，可以看 B 或 E。</p><div class="toolbar" id="toolbar" aria-label="切换比较用的日签"></div></header><main><div class="grid" id="grid"></div></main><footer>细节图放大 2 倍，完整日签可点开查看。以下均为设计候选，尚未替换全年现稿或固件。<br><a href="../tr2e_calendar_2027_editorial_v2_1/index.html">回到现有全年样稿</a></footer><dialog id="dialog"><div class="dialog-top"><span id="dialog-title"></span><button id="close">关闭</button></div><div id="dialog-page"></div></dialog><script id="study-data" type="application/json">{"variants": [{"code": "A", "name": "书末署名", "description": "疏朗的衬线字，配一条短线。像书页末尾的私人落款。", "note": "最轻，接近日历本身的文字气质。", "patch": "A.png", "ink_bounds": [25, 19, 59, 37]}, {"code": "B", "name": "细框藏书印", "description": "白底细框与日签边框呼应，留下清楚的归属标记。", "note": "适合想保留“盖章感”，又不希望太重。", "patch": "B.png", "ink_bounds": [11, 15, 64, 38]}, {"code": "C", "name": "开放角标", "description": "只保留对角的两处边角，让字标与纸面之间有呼吸。", "note": "推荐：有辨识度，也能融入细线与留白。", "patch": "C.png", "ink_bounds": [18, 15, 64, 38]}, {"code": "D", "name": "椭圆书印", "description": "纤细的椭圆围住署名，带一点旧书藏章的温和感。", "note": "轮廓柔和，比矩形更有手工印记的感觉。", "patch": "D.png", "ink_bounds": [8, 10, 64, 38]}, {"code": "E", "name": "双行方印", "description": "将 Tr／2e 排成两行，收进小方框，像一枚简洁私印。", "note": "印章感最强，字标的存在感也更明确。", "patch": "E.png", "ink_bounds": [28, 2, 64, 38]}, {"code": "F", "name": "轻邮戳", "description": "圆形邮戳配两道短波纹，像给这一页留下寄出的印记。", "note": "更有叙事趣味，装饰性也更明显。", "patch": "F.png", "ink_bounds": [5, 2, 64, 38]}], "dates": ["2027-01-09", "2027-08-08", "2027-12-30"], "source": "../tr2e_calendar_2027_editorial_v2_1/days/", "patch_box": [300, 530, 365, 570]}</script><script>
const data=JSON.parse(document.getElementById('study-data').textContent),$=id=>document.getElementById(id);let date=data.dates[0],selected=null;const labels=['三行短句 · 1月9日','更短选句 · 8月8日','长段正文 · 12月30日'];
function sheet(v){return `<div class="sheet" role="button" tabindex="0" data-code="${v.code}" aria-label="查看 ${v.code} ${v.name} 完整日签"><img class="base" src="${data.source+date}.png" width="400" height="600" alt="${date} 日签"><img class="patch" src="${v.patch}" width="65" height="40" alt="${v.name} Tr2e 落款"></div>`}
function draw(){$('toolbar').innerHTML=data.dates.map((d,i)=>`<button data-date="${d}" aria-pressed="${date===d}">${labels[i]}</button>`).join('');$('grid').innerHTML=data.variants.map(v=>`<article class="card ${v.code==='C'?'recommended':''}" data-variant="${v.code}">${v.code==='C'?'<span class="tag">推荐</span>':''}<h2><span class="code">${v.code}</span>${v.name}</h2><p class="desc">${v.description}</p><div class="micro"><span>落款细节 ×2</span><img src="${v.patch}" alt="${v.code} 放大细节"></div>${sheet(v)}<p class="note">${v.note}</p><p class="downloads"><a href="${v.code}-${date}.png" download>保存本版日签</a></p></article>`).join('')}
function open(v){selected=v;$('dialog-title').textContent=v.code+' · '+v.name;$('dialog-page').innerHTML=sheet(v);$('dialog-page').firstChild.removeAttribute('role');$('dialog-page').firstChild.removeAttribute('tabindex');if(!$('dialog').open)$('dialog').showModal()}
$('toolbar').onclick=e=>{const el=e.target.closest('[data-date]');if(el){date=el.dataset.date;draw()}};$('grid').onclick=e=>{const el=e.target.closest('.sheet');if(el)open(data.variants.find(v=>v.code===el.dataset.code))};$('grid').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('sheet')){e.preventDefault();open(data.variants.find(v=>v.code===e.target.dataset.code))}};$('close').onclick=()=>$('dialog').close();draw();
</script></body></html>
